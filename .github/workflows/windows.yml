name: Windows build + tests

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build all targets
        run: cmake --build build --config Release --parallel
      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Mechanics harness
        shell: pwsh
        run: |
          # Fresh Browser.exe + full user-mechanics script.
          Get-Content tests/ci_boot.txt, tests/mechanics.txt |
            Set-Content tests/ci_run.txt -Encoding ascii
          ./build/Release/browser_harness.exe run tests/ci_run.txt
      - name: Upload Browser.exe
        uses: actions/upload-artifact@v4
        with:
          name: Browser-Windows-${{ github.sha }}
          path: build/Release/Browser.exe
          if-no-files-found: error
          retention-days: 30

  release:
    # On version tags: publish Browser.exe as a GitHub release whose notes
    # are the top CHANGELOG section.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: Browser-Windows-${{ github.sha }}
      - name: Extract changelog section
        shell: pwsh
        run: |
          $md = Get-Content CHANGELOG.md -Raw
          if ($md -match '(?ms)^## [^\n]+\n.*?(?=^## |\z)') {
            $matches[0] | Set-Content release-notes.md -Encoding utf8
          } else { "Browser $env:GITHUB_REF_NAME" | Set-Content release-notes.md }
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} Browser.exe `
            --title "Browser ${{ github.ref_name }}" `
            --notes-file release-notes.md
