name: Windows build + tests

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build all targets
        run: cmake --build build --config Release --parallel
      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Mechanics harness
        shell: pwsh
        run: |
          # Fresh Browser.exe + full user-mechanics script.
          Get-Content tests/ci_boot.txt, tests/mechanics.txt |
            Set-Content tests/ci_run.txt -Encoding ascii
          ./build/Release/browser_harness.exe run tests/ci_run.txt
      - name: Upload Browser.exe
        uses: actions/upload-artifact@v4
        with:
          name: Browser-Windows-${{ github.sha }}
          path: build/Release/Browser.exe
          if-no-files-found: error
          retention-days: 30
