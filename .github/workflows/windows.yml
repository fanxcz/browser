name: Windows build

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build Browser.exe
        run: cmake --build build --config Release --target Browser --parallel
      - name: Upload Browser.exe
        uses: actions/upload-artifact@v4
        with:
          name: Browser-Windows-${{ github.sha }}
          path: build/Release/Browser.exe
          if-no-files-found: error
          retention-days: 30
